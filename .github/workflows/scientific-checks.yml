name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate, replay, compare and run regressions
        shell: bash
        run: |
          set -euo pipefail
          export RAW="$RUNNER_TEMP/p053-scientific"
          mkdir -p "$RAW"
          ulimit -t 180
          ulimit -v 2621440
          ulimit -f 1048576
          ulimit -n 128
          timeout --signal=TERM --kill-after=10s 240s bash -euo pipefail <<'CHECKS' > "$RAW/console.log" 2>&1
          python -B tests/hoisting_regression.py
          python -B -m bptc.publication_campaign --root . --out "$RAW/main" --label main --ledger "$RAW/budget.json"
          python -B -m bptc.publication_campaign --root . --out "$RAW/reproduction" --label reproduction --ledger "$RAW/budget.json"
          python -B tools/validate_results.py --results-dir "$RAW/main" --compare-dir "$RAW/reproduction" --replay --ledger "$RAW/budget.json" --out "$RAW/semantic-replay.json"
          python -B tools/validate_results.py --results-dir "$RAW/main" --compare-dir results/publication/main --out "$RAW/retained-comparison.json"
          python -B tools/run_tests.py --ledger "$RAW/budget.json" --out "$RAW/tests.json"
          CHECKS
      - name: Upload raw outputs on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p053-scientific-raw
          path: ${{ runner.temp }}/p053-scientific
          if-no-files-found: warn
          retention-days: 14

  retained-current-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2378684679c2ee51233af2b897ac9228e83a49da
          path: measured-context
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: project/artifact
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check absent-only preparation and exact historical/current receipt
        shell: bash
        run: |
          set -euo pipefail
          python -B project/artifact/tests/context_regression.py
          python -B project/artifact/native/prepare_current_context.py --historical-project measured-context
          python -B project/artifact/native/current_correctness.py --historical-project measured-context

  native-correctness:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch the pinned official compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'zig-0.15.2.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'Compiler archive differs from the official release' }
          $tools = Join-Path $env:RUNNER_TEMP 'zig-toolchain'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          "ZIG_EXE=$(Join-Path $tools 'zig-x86_64-windows-0.15.2/zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Populate the cold compiler cache with the optimized native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os
          import subprocess
          from pathlib import Path
          root = Path.cwd()
          output = Path(os.environ['RUNNER_TEMP']) / 'p053-cold-native.exe'
          command = [os.environ['ZIG_EXE'], 'c++', '-std=c++17', '-target',
                     'x86_64-windows-gnu', '-Wall', '-Wextra', '-Wconversion',
                     '-Wno-sign-conversion', '-O3', '-DNDEBUG',
                     str(root / 'native' / 'native_bridge.cpp'), '-o', str(output)]
          subprocess.run(command, check=True, timeout=600)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Cold native compilation failed' }
      - name: Compile both native modes and check all declared semantics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B native/bridge.py prepare --out "$env:RUNNER_TEMP/p053-native" --zig "$env:ZIG_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Native conformance failed' }
      - name: Retain correctness evidence; do not benchmark shared runners
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p053-native-correctness
          path: |
            ${{ runner.temp }}/p053-native/*.json
            ${{ runner.temp }}/p053-native/*.log
            ${{ runner.temp }}/p053-native/panel.txt
          if-no-files-found: warn
          retention-days: 14
